Automated_NLP_News_Verification_Pipeline:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      private_key_path: /opt/airflow/dbt/rsa_key.p8
      private_key_passphrase: "{{ env_var('DBT_PRIVATE_KEY_PASSPHRASE') }}"
      role: DBT_DEV_ROLE
      database: FAKE_NEWS_DB
      warehouse: FAKE_NEWS_WH
      schema: RAW
      threads: 1
      client_session_keep_alive: False
